[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pytest-mrt"
version = "1.9.1"
description = "Catch database migration rollback failures before they reach production"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "croc100", email = "croc100@crode.net" }]
keywords = [
    "pytest", "alembic", "migrations", "database",
    "testing", "rollback", "sqlalchemy",
    "django", "migration-safety", "data-safety",
]
classifiers = [
    "Framework :: Pytest",
    "License :: OSI Approved :: MIT License",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: Django",
    "Topic :: Software Development :: Testing",
    "Topic :: Database",
]
dependencies = [
    "pytest>=8.0",
    "alembic>=1.13",
    "sqlalchemy>=2.0",
    "rich>=13.0",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/croc100/pytest-mrt"
Documentation = "https://croc100.github.io/pytest-mrt"
Repository = "https://github.com/croc100/pytest-mrt"
Issues = "https://github.com/croc100/pytest-mrt/issues"
Changelog = "https://github.com/croc100/pytest-mrt/releases"

[project.optional-dependencies]
dev = [
    "pytest",
    "coverage",
    # Without this, tests/test_explain.py skips itself and the `mrt explain`
    # path goes untested in CI.
    "anthropic>=1.0",
    "psycopg[binary]>=3.2",
    "psycopg2-binary",
    "hatch",
    "ruff",
    "mypy",
    "types-PyMySQL",
]
# Both drivers: SQLAlchemy 2.0 resolves a bare "postgresql://" URL to psycopg2,
# 2.1 resolves it to psycopg 3. Shipping both keeps plain URLs working on either.
postgres = ["psycopg[binary]>=3.2", "psycopg2-binary"]
asyncpg = ["asyncpg"]
mysql = ["PyMySQL>=1.1"]
oracle = ["oracledb>=1.3"]
mssql = ["pymssql>=2.2"]
django = ["django>=4.2"]
ai = ["anthropic>=1.0"]

[project.entry-points."pytest11"]
mrt = "pytest_mrt.plugin"

[project.scripts]
mrt = "pytest_mrt.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["pytest_mrt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source_pkgs = ["pytest_mrt"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    '\.\.\.',
]

[tool.coverage.paths]
source = [
    "pytest_mrt/",
    "*/site-packages/pytest_mrt/",
]

[tool.ruff]
line-length = 99
target-version = "py310"
exclude = ["examples/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",   # line too long — handled by formatter
]

[tool.mypy]
ignore_missing_imports = true
no_strict_optional = true
