name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      src:      ${{ steps.filter.outputs.src }}
      tests:    ${{ steps.filter.outputs.tests }}
      django:   ${{ steps.filter.outputs.django }}
      postgres: ${{ steps.filter.outputs.postgres }}
      mysql:    ${{ steps.filter.outputs.mysql }}
      ci:       ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            src:
              - 'pytest_mrt/**'
              - 'pyproject.toml'
            tests:
              - 'tests/**'
              - 'scripts/**'
            django:
              - 'pytest_mrt/adapters/django*.py'
              - 'tests/test_django*.py'
            postgres:
              - 'tests/test_postgres.py'
            mysql:
              - 'tests/test_mysql.py'
            ci:
              - '.github/workflows/ci.yml'

  lint:
    needs: changes
    if: ${{ needs.changes.outputs.src == 'true' || needs.changes.outputs.tests == 'true' || needs.changes.outputs.ci == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install ruff and mypy
        run: pip install ruff mypy types-PyMySQL sqlalchemy alembic pytest rich typer

      - name: Lint (ruff)
        run: ruff check pytest_mrt/ tests/ scripts/

      - name: Format check (ruff)
        run: ruff format --check pytest_mrt/ tests/ scripts/

      - name: Type check (mypy)
        run: mypy pytest_mrt/ --ignore-missing-imports --no-strict-optional

  test:
    needs: changes
    if: ${{ needs.changes.outputs.src == 'true' || needs.changes.outputs.ci == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    # 3.15 is still a prerelease — run it for early warning, but never block a merge.
    continue-on-error: ${{ matrix.python-version == '3.15' }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install
        run: pip install -e ".[dev]"

      - name: Run tests
        run: coverage run -m pytest tests/ -v --ignore=tests/test_postgres.py --ignore=tests/test_mysql.py --ignore=tests/test_oracle.py --ignore=tests/test_mssql.py && coverage xml

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        if: matrix.python-version == '3.14'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: unittests
          fail_ci_if_error: false

  test-postgres:
    needs: changes
    if: ${{ needs.changes.outputs.src == 'true' || needs.changes.outputs.postgres == 'true' || needs.changes.outputs.ci == 'true' }}
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: mrt
          POSTGRES_PASSWORD: mrt
          POSTGRES_DB: mrt_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install
        run: pip install -e ".[dev,postgres]"

      - name: Run PostgreSQL tests
        env:
          TEST_DATABASE_URL: postgresql://mrt:mrt@localhost:5432/mrt_test
        run: coverage run -m pytest tests/test_postgres.py -v

  test-mysql:
    needs: changes
    if: ${{ needs.changes.outputs.src == 'true' || needs.changes.outputs.mysql == 'true' || needs.changes.outputs.ci == 'true' }}
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_USER: mrt
          MYSQL_PASSWORD: mrt
          MYSQL_ROOT_PASSWORD: mrt_root
          MYSQL_DATABASE: mrt_test
        options: >-
          --health-cmd "mysqladmin ping -h localhost -umrt -pmrt"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 3306:3306

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install
        run: pip install -e ".[dev,mysql]"

      - name: Run MySQL tests
        env:
          TEST_DATABASE_URL: mysql+pymysql://mrt:mrt@localhost:3306/mrt_test
        run: coverage run -m pytest tests/test_mysql.py -v

  test-django:
    needs: changes
    if: ${{ needs.changes.outputs.src == 'true' || needs.changes.outputs.django == 'true' || needs.changes.outputs.ci == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        django-version: ["5.2", "6.0", "6.1"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install
        run: pip install -e ".[dev,django]" "django~=${{ matrix.django-version }}"

      - name: Run Django dynamic rollback tests
        run: pytest tests/test_django_dynamic.py -v

  # Always-green wrapper — the only job registered as a required status check.
  # Succeeds when all conditional jobs either passed or were skipped (docs-only
  # PRs skip everything, but this job still reports green so the PR can merge).
  ci:
    needs: [lint, test, test-django, test-postgres, test-mysql]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs passed or were skipped
        run: |
          results='${{ toJSON(needs.*.result) }}'
          if echo "$results" | grep -qE '"failure"|"cancelled"'; then
            echo "One or more required jobs failed or were cancelled."
            exit 1
          fi
          echo "All jobs passed or were skipped."

