name: Extended DB matrix

# Oracle and SQL Server are verified here rather than on every pull request.
# Measured on PR #101, the two jobs cost 141s of the 612s each PR spent in CI
# (23%) and there is no evidence of anyone using either backend — so they run
# weekly against main, on a pull request that touches their own tests, and on
# demand. Support is unchanged; only the verification cadence is.
on:
  schedule:
    - cron: "0 5 * * 1"  # Mondays 05:00 UTC
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'tests/test_oracle.py'
      - 'tests/test_mssql.py'
      - 'pytest_mrt/core/runner.py'
      - 'pytest_mrt/core/seeder.py'
      - '.github/workflows/db-matrix.yml'

jobs:
  test-oracle:
    runs-on: ubuntu-latest

    services:
      oracle:
        image: gvenzl/oracle-free:23-slim
        env:
          ORACLE_PASSWORD: mrt_root
          APP_USER: mrt
          APP_USER_PASSWORD: mrt
        options: >-
          --health-cmd "healthcheck.sh"
          --health-interval 20s
          --health-timeout 10s
          --health-retries 10
        ports:
          - 1521:1521

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install
        run: pip install -e ".[dev,oracle]"

      - name: Run Oracle tests
        env:
          TEST_DATABASE_URL: oracle+oracledb://mrt:mrt@localhost:1521/?service_name=FREEPDB1
        run: coverage run -m pytest tests/test_oracle.py -v

  test-mssql:
    runs-on: ubuntu-latest

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2025-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: MrtTest1234!
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U SA -P 'MrtTest1234!' -Q 'SELECT 1' -No"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 1433:1433

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Configure FreeTDS (trust self-signed TLS cert)
        run: |
          printf '[global]\ntds version = 7.4\nencrypt = no\n' >> ~/.freetds.conf

      - name: Create mrt_test database
        run: |
          pip install pymssql
          python -c "
          import pymssql, time, sys
          for attempt in range(20):
              try:
                  conn = pymssql.connect(server='localhost', user='SA', password='MrtTest1234!', database='master', port=1433, autocommit=True)
                  conn.cursor().execute('CREATE DATABASE mrt_test')
                  conn.close()
                  print('Created mrt_test')
                  break
              except Exception as e:
                  print(f'Attempt {attempt+1}: {e}')
                  time.sleep(3)
          else:
              sys.exit(1)
          "

      - name: Install
        run: pip install -e ".[dev,mssql]"

      - name: Run SQL Server tests
        env:
          TEST_DATABASE_URL: mssql+pymssql://SA:MrtTest1234!@localhost:1433/mrt_test
        run: coverage run -m pytest tests/test_mssql.py -v
